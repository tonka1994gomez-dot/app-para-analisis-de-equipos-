name: Compilar APK Android

on:
  push:
    branches: [main, master]
    paths:
      - 'FOOTBALL_INTELLIGENCE_AI_Android_Project.zip.b64'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Preparar proyecto
        run: |
          base64 --decode FOOTBALL_INTELLIGENCE_AI_Android_Project.zip.b64 > project.zip
          unzip -o project.zip
      - name: Compilar APK
        run: gradle -p FOOTBALL_INTELLIGENCE_AI assembleDebug --no-daemon --stacktrace
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: football-intelligence-ai-apk
          path: FOOTBALL_INTELLIGENCE_AI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
